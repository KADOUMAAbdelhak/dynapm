# V4C.1 availability extension; V4A v1 is preserved.
adaptation:
  bootstrap_split:
    fraction: 0.3
    rule: "first 30% of entity timeline by nominal time, causal thresholds only from bootstrap"
  canonical_entity:
    key:
      - cell
      - collection_id
      - instance_index
    note: Prefer alloc instances / long-lived collections; do not double-count parent and child usage. Cell is one of the eight May 2019 Borg cells.
    preferred_population: long_lived_alloc_or_job_instances
  cohort_eligibility_exclusions:
    forbidden_exclusion_basis:
      - method_performance
      - favorable_or_unfavorable_effect_size
      - materna_outcome_similarity
    include_only_protocol_validity_codes:
      - insufficient_bootstrap_history
      - insufficient_exact_grid_feature_or_window_validity
      - insufficient_globally_verifiable_evaluation_origins
      - corrupt_or_nonfinite_source_data
      - protocol_invalid_timeline_or_schema
      - missing_positive_resource_request
      - insufficient_continuous_span_for_24h_windows
  corpus_specific_changes_not_changing_rqs:
    -
      change: entity is Borg collection_id+instance_index instead of Materna VM
      why_rq_unchanged: "RQs concern profile maintenance/cadence/cost, not VM branding"
    -
      change: "utilization is request-normalized NCU/RAM instead of provisioned %"
      why_rq_unchanged: Still a paired two-resource utilization series with identical window/truth/accounting semantics; unit difference is declared
    -
      change: multi-cell export may be one cell first for cost control
      why_rq_unchanged: "Cell choice is a corpus stratum, not a method change"
  duplicate_missing_handling:
    duplicates: "dedupe by (entity, bucket_start); keep deterministic max end_time then first row"
    missing_buckets: leave absent; never interpolate
    missing_request: resource sample ineligible for utilization
    nonfinite: treat as missing
  evaluation_eligibility:
    forward_window: "(t,t+24h]"
    grid: phase-balanced-hourly-v1
    min_forward_paired_slots: 200
  minimum_history:
    feature_history_slots: 96
    minimum_paired_finite_slots_for_refresh: 200
    minimum_total_observations_guidance: 2000
    slots_per_24h: 288
  nominal_cadence:
    binning_rule: Map each usage record to nominal five-minute grid by floor(start_time) to 300s buckets in trace-relative microseconds; never upsample or invent missing buckets
    source: instance_usage windows typically 300s; may be shorter at lifetime edges
    target_seconds: 300
  profile_eligibility:
    both_resources_required: true
    min_paired_finite_slots: 200
    trailing_window: "(t-24h,t]"
  resource_fields:
    cpu_series: instance_usage.average_usage.cpus
    forbidden_as_primary_memory: random_sample_usage (CPU-only)
    memory_series: instance_usage.average_usage.memory
    optional_cpu_tail: tail_cpu_usage_distribution
  units_and_normalization:
    materna_percent_equivalence: false
    profile_utilization_definition: "request_normalized_utilization = average_usage / request when request>0 for that resource; else exclude sample as missing"
    raw_units:
      cpu: normalized_compute_units_NCU
      memory: normalized_RAM
    scientific_meaning_transfer: "Profiles remain trailing-window mean/p95 and class gates on a paired two-resource utilization series evaluated hourly against forward (t,t+24h] truth. Units are request-normalized Borg usage, not Materna provisioned-capacity percentages. RQs about maintenance, cadence, rewrite cost, and robustness are unchanged; cross-corpus claims must state the unit adaptation."
canonical_start_labels_unchanged: true
clock_contract:
  admitted_at: q; conservative completed-bin admission even for early-ending partial intervals
  analysis_label: "q = b + cadence_us; nominal closing-slot label, an explicit derived view"
  available_at: a = source_end_time_us
  bootstrap: "first floor(0.30*N) nominal closing slots; observed q < cut; thresholds freeze from completed bootstrap at first streaming q"
  cadence_us: 300000000
  canonical_storage_label: "b = floor(source_start_time_us / cadence_us) * cadence_us; unchanged"
  coverage: ">=200/288 paired finite observed slots, with no imputation, clipping, rescaling or duration weighting"
  horizon_slots: 288
  invalid_interval: block this clock contract for a cell with noncontained/overlapping/duplicate retained intervals; do not silently exclude or split
  measurement_interval: "[source_start_time_us, source_end_time_us)"
  partial_intervals: one observed partial interval counts as one nominal slot; never claim 288 complete-duration measurements
  periodic: "anchor=first streaming q; existing anchored pending/coalescing grid; require observed completed q and >=200 paired trailing slots plus inherited 96 complete slots for PW"
  policy_outcomes_authorized: false
  reads: r is a physical trace-relative clock on the 300s grid; hourly anchor is first streaming q
  required_containment: b <= source_start_time_us < source_end_time_us <= q; one row per entity/b
  residual_state: "if used in future: history/state uses admitted q only; one-step target at q cannot enter features before q"
  scientific_questions_changed: false
  trailing: "closing slots (r-24h,r], q=r-287*cadence,...,r; physical bins [r-24h,r)"
  truth: "closing slots (r,r+24h], q=r+cadence,...,r+288*cadence; physical bins [r,r+24h)"
  verification: not before r+24h; full target horizon within trace; every used a <= verification read
  version: google-completed-slot-availability-v1
  visible_at_read: a <= r AND q <= r; all state consumers use this gate
disposition: AVAILABILITY_CONTRACT_DEFINED; requires per-cell timing validation
execution_guards:
  download_full_dataset_in_v4a: false
  rank_by_expected_favorable_effects: false
  run_dynapm_pw_outcomes_in_v4a: false
gate: V4C.1
inherited_from_v3_unchanged:
  accounting_label: refresh-accounting-v1
  bootstrap_fraction: 0.3
  comparison_families:
    F1_maintenance_vs_none:
      -
        control: static
        treatment: pw_12h
      -
        control: static
        treatment: pw_6h
      -
        control: static
        treatment: pw_3h
    F2_cadence_increments:
      -
        control: pw_12h
        treatment: pw_6h
      -
        control: pw_6h
        treatment: pw_3h
    F3_high_cost_limit:
      -
        control: pw_3h
        treatment: full_rewrite
  evaluation_grid_label: phase-balanced-hourly-v1
  forward_truth_window: "(t,t+24h]"
  methods:
    - static
    - pw_12h
    - pw_6h
    - pw_3h
    - full_rewrite
  observation_window: "(t-24h,t], >=200/288 paired finite resource slots where refresh eligibility applies"
  practical_significance: NOT_DEFINED_AT_PROFILE_LEVEL
  primary_cost_endpoint: n_refresh_events
  primary_fidelity_endpoints:
    - cpu_class_correctness
    - memory_class_correctness
    - cpu_p95_profile_mae
    - memory_p95_profile_mae
  statistics:
    bootstrap_repetitions: 10000
    bootstrap_seed: 20251022
    multiplicity: holm_within_family
    paired_test: wilcoxon
    zero_method: wilcox
  study_framing: estimation_first
  temporal_protocol_label: causal-timeline-v3
  withdrawn_claims:
    - C1_forecasting_superiority
    - C2_adaptive_refresh_superiority
