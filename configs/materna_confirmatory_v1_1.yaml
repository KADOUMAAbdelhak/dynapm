practical_significance:
  status: NOT_DEFINED_AT_PROFILE_LEVEL
  numeric_margins: not_invented
  blocks_v25_pass: false
  blocks_v3_execution: false
  interpretation: V3 reports estimation quantities only. Profile-level numeric practical-benefit / acceptable-harm margins are explicitly not defined. Statistical distinguishability must never be translated into operational superiority.
  rationale_why_numeric_margins_unavailable:
    profile_error_units: "Primary fidelity errors are utilization percentages / class fractions on offline profiles, not SLO or capacity outcomes."
    operational_dependence: "Any operational effect depends on resource capacity, request/limit mapping, controller policy, and SLO definitions."
    no_universal_conversion: No validated universal conversion from profile MAE/class error to operational benefit currently exists for this study.
    pilot_derived_margins_forbidden: Deriving margins from the 18-VM pilot effects would be outcome-driven and is forbidden.
    deferral: "Operational meaningfulness must be calibrated and validated in later system-validation gates (C4 / V7–V8), not invented before V3."
    external_sources:
      -
        id: asa_pvalues_2016
        citation: "Wasserstein, R. L., & Lazar, N. A. (2016). The ASA Statement on p-Values: Context, Process, and Purpose. The American Statistician, 70(2), 129–133."
        doi: 10.1080/00031305.2016.1154108
        url: "https://doi.org/10.1080/00031305.2016.1154108"
        use: Scientific conclusions and policy decisions must not rest on p-value thresholds alone; effect sizes and uncertainty are required. Separates statistical distinguishability from practical/operational superiority.
        role: external_methodology_rationale_not_dynapm_evidence
      -
        id: kubernetes_hpa_resource_utilization
        citation: Kubernetes documentation — Horizontal Pod Autoscaling (resource metrics).
        url: "https://kubernetes.io/docs/concepts/workloads/autoscaling/horizontal-pod-autoscale/"
        use: "Operational CPU/memory utilization is defined relative to configured resource requests and controller targets; mapping offline profile-utilization error to autoscaling/SLO outcomes therefore depends on capacity, request/limit mapping, and controller policy — not a universal profile-level margin."
        role: external_systems_rationale_not_dynapm_evidence
    separation_from_dynapm_evidence: External sources justify methodology and systems semantics only; they are not DynAPM empirical evidence of benefit.
  per_endpoint:
    cpu_class_correctness:
      practical_benefit_margin: null
      acceptable_harm_margin: null
      practical_significance: NOT_DEFINED_AT_PROFILE_LEVEL
    memory_class_correctness:
      practical_benefit_margin: null
      acceptable_harm_margin: null
      practical_significance: NOT_DEFINED_AT_PROFILE_LEVEL
    cpu_p95_profile_mae:
      practical_benefit_margin: null
      acceptable_harm_margin: null
      practical_significance: NOT_DEFINED_AT_PROFILE_LEVEL
    memory_p95_profile_mae:
      practical_benefit_margin: null
      acceptable_harm_margin: null
      practical_significance: NOT_DEFINED_AT_PROFILE_LEVEL
statistics:
  unit: vm
  study_type: pre_specified_estimation
  paired_differences: treatment_minus_control_per_vm
  report:
    - median_effect
    - mean_effect
    - paired_bootstrap_95ci
    - paired_nonparametric_test
    - zero_and_tie_handling
    - effect_size
    - multiplicity_adjusted_p
    - statistical_distinguishability
    - refresh_write_change_costs
    - pareto_fidelity_cost_relationships
  bootstrap:
    repetitions: 10000
    seed: 20251022
    ci_level: 0.95
    method: percentile_of_paired_mean_and_median_differences
  paired_test:
    name: wilcoxon_signed_rank
    zero_method: wilcox
    tie_policy: report_effective_n_and_use_documented_approximation_or_permutation
    all_ties_rule: effect_zero_p_equals_1
  effect_size:
    primary: paired_median_difference
    standardized: mean_difference_divided_by_sd_of_paired_differences
    undefined_when: sd_of_paired_differences_equals_zero
  multiplicity:
    method: holm
    alpha: 0.05
    scope: within_each_comparison_family_separately
    families:
      - F1_maintenance_vs_none
      - F2_cadence_increments
      - F3_high_cost_limit
  robustness_analyses:
    primary: false
    includes:
      - volatility_tier_strata
      - trace_strata
      - resource_specific_endpoints
    claim_rule: no_subgroup_driven_primary_claims_unless_predefined_here
  practical_significance_rule: Profile-level practical significance is NOT_DEFINED_AT_PROFILE_LEVEL. Do not invent numeric margins. Do not infer operational superiority from statistical significance.
decision_logic:
  status: ESTIMATION_FIRST_FROZEN
  v3_may_establish:
    - direction
    - magnitude
    - uncertainty
    - statistical_distinguishability
  rules:
    -
      id: R1_estimation_scope
      text: "V3 may establish direction, magnitude, uncertainty, and statistical distinguishability for the frozen F1–F3 contrasts and endpoints."
    -
      id: R2_no_p_value_operational_superiority
      text: Statistical significance alone must never imply practical or operational superiority.
    -
      id: R3_no_cadence_recommendation_from_p
      text: Do not recommend a refresh cadence solely from p-values.
    -
      id: R4_pareto_dominance
      text: "Call a method strictly Pareto-dominated only when the predefined fidelity/cost evidence satisfies dominance on all four primary fidelity endpoints (favorable directions) and primary cost (n_refresh_events), using both paired median and paired mean effects: the dominating method is nowhere worse and strictly better on at least one fidelity endpoint or cost. Otherwise report the fidelity–cost trade-off without a dominance label."
    -
      id: R5_operational_benefit_is_c4
      text: Operational/practical benefit remains claim C4 and is deferred to system-validation gates (V7–V8).
    -
      id: R6_negative_null_small_publishable
      text: "Negative, null, and small effects remain valid and publishable estimation findings."
    -
      id: R7_no_expected_winners
      text: Do not encode expected winners; comparisons remain those frozen in F1–F3.
    -
      id: R8_no_materially_better_without_ops
      text: "Do not use wording such as 'materially better' or 'practically meaningful improvement' for profile endpoints unless later operational evidence (C4) supports that language."
future_gates:
  V3: Materna confirmatory estimation study (non-adaptive)
  V4: independent production-corpus suitability/acquisition
