architecture:
  name: per_cell_events_then_usage_streaming_canonicalize
  order:
    - preflight billing/dry-run/disk
    - "cell e: acquire events -> compressed parquet chunks"
    - "cell e: build request-history index"
    - "cell e: stream usage pages; canonicalize incrementally; write canonical parquet chunks"
    - "cell e: validate; drop ephemeral usage buffers; optionally compact events to audit-min"
    - "cell g: same pipeline while retaining cell e canonical"
    - freeze cohort from e+g canonical
  no_bq_destination_tables: true
  no_gcs_export: true
  no_full_uncompressed_usage_retention: true
  process_one_cell_raw_at_a_time: true
