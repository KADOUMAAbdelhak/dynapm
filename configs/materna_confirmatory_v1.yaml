endpoints:
  primary_fidelity:
    - cpu_class_correctness
    - memory_class_correctness
    - cpu_p95_profile_mae
    - memory_p95_profile_mae
  primary_maintenance_cost: n_refresh_events
  secondary_cost_diagnostic:
    - n_field_writes
    - n_field_value_changes
    - profile_age_distribution
    - refresh_eligibility_delays
    - verified_evaluation_point_count
    - bias
  aggregation: per_vm_then_paired_across_vms
  forbidden: timestamp_level_pseudo_replication_as_statistical_unit
comparison_families:
  F1_maintenance_vs_none:
    -
      treatment: pw_12h
      control: static
    -
      treatment: pw_6h
      control: static
    -
      treatment: pw_3h
      control: static
  F2_cadence_increments:
    -
      treatment: pw_6h
      control: pw_12h
    -
      treatment: pw_3h
      control: pw_6h
  F3_high_cost_limit:
    -
      treatment: full_rewrite
      control: pw_3h
practical_effect_margins:
  status: UNASSIGNED
  blocks_v25_pass: true
  blocks_v3_execution: true
  source_policy: "Must be justified from metric semantics, measurement/profile resolution, operational interpretation, and/or external domain rationale. Must NOT be derived from observed 18-VM pilot effect sizes or confirmatory outcomes."
  cpu_class_correctness:
    practical_benefit_margin: null
    acceptable_harm_margin: null
    unit: accuracy_fraction_points
    favorable_direction: higher_is_better
    rationale_status: insufficient_without_arbitrary_choice
    rationale: "Class correctness is the fraction of evaluation origins whose profile mean utilization class (idle/low/medium/high/burst from bootstrap p20/p40/p60/p80 gates) matches truth. Without a documented consumer that maps class errors to operational cost, any numeric Δaccuracy margin is an arbitrary round number. Pilot Static→PW gains are exploratory and must not calibrate this margin."
    sources_consulted:
      - dynapm/core/discretization.py class gates
      - docs/protocol.md causal evaluation semantics
      - no engineering SLO or provisioning misclassification cost available in-repo
  memory_class_correctness:
    practical_benefit_margin: null
    acceptable_harm_margin: null
    unit: accuracy_fraction_points
    favorable_direction: higher_is_better
    rationale_status: insufficient_without_arbitrary_choice
    rationale: Same class taxonomy and consumer gap as CPU class correctness; resource identity alone does not supply a non-arbitrary margin.
    sources_consulted:
      - dynapm/core/discretization.py class gates
      - docs/protocol.md causal evaluation semantics
  cpu_p95_profile_mae:
    practical_benefit_margin: null
    acceptable_harm_margin: null
    unit: utilization_percentage_points
    favorable_direction: lower_is_better
    rationale_status: insufficient_without_arbitrary_choice
    rationale: "p95-profile MAE is continuous utilization error. Measurement resolution does not imply a practical threshold: rightsizing literature discusses capacity headroom for allocation decisions, not a transferable MAE margin for offline profile fidelity. Mapping capacity headroom to MAE requires an unstated consumer model; inventing 0.5/1.0 pp would be arbitrary."
    sources_consulted:
      - docs/protocol.md profile evaluation
      - no in-repo downstream resource-controller tolerance for profile MAE
  memory_p95_profile_mae:
    practical_benefit_margin: null
    acceptable_harm_margin: null
    unit: utilization_percentage_points
    favorable_direction: lower_is_better
    rationale_status: insufficient_without_arbitrary_choice
    rationale: Same continuous-error and consumer-model gap as CPU p95-profile MAE.
    sources_consulted:
      - docs/protocol.md profile evaluation
statistics:
  unit: vm
  paired_differences: treatment_minus_control_per_vm
  report:
    - median_effect
    - mean_effect
    - paired_bootstrap_95ci
    - paired_nonparametric_test
    - zero_and_tie_handling
    - effect_size
    - multiplicity_adjusted_p
    - statistical_significance
    - practical_significance
  bootstrap:
    repetitions: 10000
    seed: 20251022
    ci_level: 0.95
    method: percentile_of_paired_mean_and_median_differences
  paired_test:
    name: wilcoxon_signed_rank
    zero_method: wilcox
    tie_policy: report_effective_n_and_use_documented_approximation_or_permutation
    all_ties_rule: effect_zero_p_equals_1
  effect_size:
    primary: paired_median_difference
    standardized: mean_difference_divided_by_sd_of_paired_differences
    undefined_when: sd_of_paired_differences_equals_zero
  multiplicity:
    method: holm
    alpha: 0.05
    scope: within_each_comparison_family_separately
    families:
      - F1_maintenance_vs_none
      - F2_cadence_increments
      - F3_high_cost_limit
  robustness_analyses:
    primary: false
    includes:
      - volatility_tier_strata
      - trace_strata
      - resource_specific_endpoints
    claim_rule: no_subgroup_driven_primary_claims_unless_predefined_here
  practical_significance_rule: "Requires assigned practical_effect_margins. Until margins are assigned, practical significance is reported as NOT_EVALUABLE and cannot support GO."
decision_logic:
  status: TEMPLATES_FROZEN_MARGINS_REQUIRED
  rules:
    -
      id: R1_better_requires_practical_margin
      text: "Declare a method 'better' on a fidelity endpoint only when the paired effect is directionally favorable AND the practical-benefit margin criterion is met (point estimate and/or CI rule as assigned with margins); p-value alone is insufficient."
    -
      id: R2_negligible_fidelity_blocks_added_cost
      text: Do not recommend an added-cost method when its fidelity improvement over the cheaper comparator is practically negligible under the assigned margins.
    -
      id: R3_full_rewrite_dominance
      text: Full-Rewrite is dominated if its incremental fidelity benefit over PW-3h fails the practical-benefit criterion while requiring materially greater refresh cost (n_refresh_events).
    -
      id: R4_negative_null_valid
      text: Negative and null findings are valid confirmatory outcomes and may support NO-GO or narrowed claims.
    -
      id: R5_no_expected_winners
      text: Do not encode expected winners; comparisons remain those frozen in F1–F3.
    -
      id: R6_margins_gate
      text: "While practical_effect_margins.status is UNASSIGNED, overall confirmatory GO is impossible; V2.5 remains BLOCKED and V3 must not execute."
future_gates:
  V3: Materna confirmatory non-adaptive study
  V4: independent production-corpus suitability/acquisition
  V5: "second-corpus replication, preferably Google ClusterData 2019 if suitability remains valid"
  V6: maintenance-cost/service benchmark
  V7: Kubernetes profile→resource-management harness
  V8: repeated operational/system validation
  V9: final claim audit / venue decision
  claim_rule: Do not claim C3–C6 before their corresponding gates pass.
execution_guards:
  scientific_run_in_v25: false
  access_confirmatory_outcomes: false
  new_predictor_trigger_selector_cadence_or_algorithm: false
  use_pilot_effects_to_choose_margins_or_hypotheses: false
