# Frozen by V2.5 — authoritative twin is materna_confirmatory_v1.json
schema_version: materna-confirmatory-design-v1
gate: V2.5
gate_status: BLOCKED
blocker: practical_effect_margins_unassigned
blocker_rationale: "Defensible numeric practical-benefit and acceptable-harm margins for the four primary fidelity endpoints cannot be established from metric semantics, profile resolution, or an external operational requirement without arbitrary round-number choices. Deriving margins from the 18-VM pilot effects is forbidden. Margins remain null; V3 execution stays blocked until a separate authorized margin freeze assigns them without confirmatory outcome access and without pilot-effect calibration."
withdrawn_claims:
  - C1_forecasting_superiority
  - C2_adaptive_refresh_superiority
branding:
  repository_name: DynAPM
  continuity_note: Repository name may remain for continuity; manuscript framing must not imply validated adaptive or predictive functionality.
  working_contribution: "A rigorous empirical methodology and benchmark for application-profile maintenance, refresh cadence, freshness, cost, and downstream validity."
  manuscript_title: null
research_questions:
  RQ1: Does periodic observation-window profile maintenance materially improve profile fidelity over Static?
  RQ2: "How do 12h, 6h, and 3h periodic refresh cadences trade profile fidelity against maintenance cost?"
  RQ3: Does Full-Rewrite provide practically meaningful fidelity improvement over PW-3h sufficient to justify its much higher refresh/write cost?
  RQ4: "Are these conclusions consistent across traces, resources, and predefined volatility strata?"
protocol:
  temporal: causal-timeline-v3
  evaluation_grid: phase-balanced-hourly-v1
  accounting: refresh-accounting-v1
  observation_window: paired-observation-window-24h-v1
  observation_window_semantics: "(t-24h,t], >=200/288 paired finite CPU+memory slots where refresh eligibility applies"
